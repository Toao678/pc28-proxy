<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC28 预测系统 · 修复版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #f5f6fa; color: #2c3e50; padding: 12px; font-size: 13px; line-height: 1.6; }
h1 { text-align: center; font-size: 16px; color: #1a3a5c; margin-bottom: 8px; }
.panel { background: #ffffff; border: 1px solid #dde3ec; border-radius: 8px; padding: 10px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
.row span { color: #5a6f8a; }
.row strong { color: #1a1a1a; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; color: #fff; }
.tag-big-odd { background: #c0392b; }
.tag-big-even { background: #2980b9; }
.tag-small-odd { background: #27ae60; }
.tag-small-even { background: #8e44ad; }
.tag-kill { background: #e74c3c; }
.tag-buy { background: #27ae60; }
table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; }
th, td { padding: 4px 6px; text-align: center; border: 1px solid #dde3ec; }
th { background: #eef2f7; }
.hit { color: #27ae60; font-weight: bold; }
.miss { color: #e74c3c; font-weight: bold; }
.pending { color: #f39c12; }
#log { max-height: 140px; overflow-y: auto; background: #f0f2f5; padding: 8px; border-radius: 4px; font-size: 11px; color: #5a6f8a; margin-top: 10px; border: 1px solid #dde3ec; }
.btn-reset { display: inline-block; padding: 6px 16px; background: #e74c3c; color: #fff; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; margin-top: 6px; }
.btn-reset:active { background: #a93226; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 4px; }
.stat-card { background: #f8f9fb; border: 1px solid #dde3ec; border-radius: 6px; padding: 6px 8px; text-align: center; }
.stat-card .num { font-size: 18px; font-weight: bold; }
.stat-card .label { font-size: 11px; color: #5a6f8a; }
.stat-card .rate { font-size: 14px; font-weight: bold; color: #1a3a5c; }
</style>
</head>
<body>

<h1>🎯 PC28 预测系统 · 修复版</h1>

<div class="panel">
  <div class="row"><span>目标期</span><strong id="target">--</strong></div>
  <div class="row"><span>上期</span><strong id="prev">--</strong></div>
  <div class="row"><span>模型A</span><strong id="model-a">--</strong></div>
  <div class="row"><span>模型B</span><strong id="model-b">--</strong></div>
  <div class="row"><span>杀组</span><strong id="kill-group" class="tag tag-kill">--</strong></div>
  <div class="row"><span>买入</span><strong id="buy-groups" class="tag tag-buy">--</strong></div>
</div>

<div class="panel">
  <div class="stat-grid">
    <div class="stat-card"><div class="label">A</div><div class="num" id="stat-a">0/0</div><div class="rate" id="stat-a-rate">0%</div></div>
    <div class="stat-card"><div class="label">B</div><div class="num" id="stat-b">0/0</div><div class="rate" id="stat-b-rate">0%</div></div>
    <div class="stat-card"><div class="label">组合</div><div class="num" id="stat-final">0/0</div><div class="rate" id="stat-final-rate">0%</div></div>
  </div>
  <button class="btn-reset" id="btn-reset">🗑 清零</button>
</div>

<div class="panel">
  <table><thead><tr><th>期号</th><th>开奖</th><th>类型</th><th>预测</th><th>结果</th></tr></thead><tbody id="history-body"></tbody></table>
</div>

<div id="log"><p>⏳ 启动中...</p></div>

<script>
// ============================================================
// 一、配置
// ============================================================
const API_URL = "https://pc28.help/api/kj.json?nbr=100";
const CHECK_INTERVAL = 15000;

// ============================================================
// 二、Toao 风格 fetchWithTimeout
// ============================================================
function fetchWithTimeout(url, timeoutMs) {
  return new Promise(function(resolve, reject) {
    var controller = new AbortController();
    var timer = setTimeout(function() {
      controller.abort();
      reject(new Error('请求超时'));
    }, timeoutMs || 10000);
    fetch(url, { signal: controller.signal })
      .then(function(res) {
        clearTimeout(timer);
        resolve(res);
      })
      .catch(function(err) {
        clearTimeout(timer);
        reject(err);
      });
  });
}

// ============================================================
// 三、完整算法
// ============================================================
function mulberry32(seed) {
  function imul32(a,b){ let v=((a&0xFFFFFFFF)*(b&0xFFFFFFFF))&0xFFFFFFFF; if(v&0x80000000)v-=0x100000000; return v; }
  let a=(parseInt(seed)&0xFFFFFFFF)+0x6D2B79F5; a&=0xFFFFFFFF;
  let t=imul32((a^(a>>15)),(1|a));
  t=(t+imul32((t^(t>>7)),(61|t)))^t; t&=0xFFFFFFFF; t^=(t>>14);
  return ((t&0xFFFFFFFF)/4294967296.0);
}
const SEQ=[[0,3,9,12,15,18,21,24,27],[1,4,7,10,13,16,19,22,25],[2,5,8,11,14,17,20,23,26]];
function sameSeq(a,b){ return SEQ.some(s=>s.includes(a)&&s.includes(b)); }
const RULES={
  same:{"小双":["小双","大双","大单"],"小单":["小单","大单","大双"],"大双":["大双","小双","小单"],"大单":["大单","小单","小双"]},
  diff:{"小双":["小双","小单","大单"],"小单":["小单","小双","大双"],"大双":["大双","大单","小单"],"大单":["大单","大双","小双"]}
};
function getType(s){ return (s >= 14 ? "大" : "小") + (s % 2 === 1 ? "单" : "双"); }
function isBig(s){ return s >= 14; }
function recent(h,w){ return h.length >= w ? h.slice(-w) : h; }
function pBig(h,w){ const r=recent(h,w); if(!r.length) return 0.5; return r.filter(x=>isBig(x.sum)).length / r.length; }
function maxStreak(h,w){ const r=recent(h,w); if(!r.length) return 0; let m=1,c=1; for(let i=1;i<r.length;i++){ if(isBig(r[i].sum)===isBig(r[i-1].sum)){c++;m=Math.max(m,c)}else c=1} return m; }
function alternation(h,w){ const r=recent(h,w); let a=0; for(let i=1;i<r.length;i++) if(isBig(r[i].sum)!==isBig(r[i-1].sum)) a++; return a; }
function judgeType(h){
 if(h.length<10) return "均衡型";
 const ws=[10,20,30].filter(w=>h.length>=w);
 const types=ws.map(w=>{
  const p=pBig(h,w), s=maxStreak(h,w), a=alternation(h,w);
  if(s<=2 && a>=Math.max(6,Math.floor(w*0.6))) return "交替型";
  if((p>=0.6||p<=0.4) && s>=4) return "趋势型";
  if((p>=0.55||p<=0.45) && s<=2 && a<=Math.max(5,Math.floor(w*0.5))) return "信号型";
  return "均衡型";
 });
 const cnt={}; types.forEach(t=>cnt[t]=(cnt[t]||0)+1);
 const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
 if(best[0]!=="均衡型" && best[1]<2) return "均衡型";
 return best[0];
}
function modelAWindow(h,w){
 const r=recent(h,w); if(!r.length) return {score:0.5,pBig:0.5,reliability:0};
 const p=pBig(h,w);
 const sh=recent(h,Math.min(5,h.length)); const sp=sh.length ? sh.filter(x=>isBig(x.sum)).length/sh.length : 0.5;
 const trend=0.5+Math.max(-0.25,Math.min(0.25,(sp-0.5)*0.8));
 const lb=isBig(r[r.length-1].sum); let cs=1; for(let i=r.length-2;i>=0;i--){ if(isBig(r[i].sum)===lb) cs++; else break; }
 const streakSig=0.5+(lb?0.25:-0.25)*Math.min(cs/5,1);
 let score=p*0.4+trend*0.3+streakSig*0.3;
 if(cs>=4&&cs<6){ const adj=Math.min(0.03,0.01*(cs-3)); score+=lb?-adj:adj; }
 score=Math.max(0,Math.min(1,score));
 const rel=Math.min(r.length/w,1)*0.6+Math.min(Math.abs(p-0.5)*2,0.5)*0.4;
 return {score,pBig:p,reliability:rel};
}
function predictA(h){
 const res={}; [10,20,30,50,100].forEach(w=>res[w]=modelAWindow(h,w));
 const weights={10:0.10,20:0.15,30:0.20,50:0.25,100:0.30};
 let ws=0,tw=0; Object.keys(weights).forEach(w=>{ const eff=weights[w]*Math.max(res[w].reliability,0.30); ws+=eff*res[w].score; tw+=eff; });
 const fs=tw>0?ws/tw:0.5;
 return {prediction:fs>=0.5?"大":"小", weightedProbability:{"大":fs,"小":1-fs}, type:judgeType(h) };
}
function getBPrediction(seed, prev){
 const rv=mulberry32(seed+parseInt(prev.nbr));
 const prod=rv*prev.sum;
 const digits=prod.toFixed(3).replace(".","");
 const fs=[...digits].map(Number).reduce((a,b)=>a+b,0);
 const ct=getType(fs);
 const rs=[...rv.toFixed(8).split(".")[1].slice(0,3)].map(Number).reduce((a,b)=>a+b,0);
 const same=sameSeq(rs,prev.sum);
 return RULES[same?"same":"diff"][ct].slice();
}
function seedBacktest(h,seed){
 if(h.length<50) return {error:1};
 const hits=[]; for(let i=50;i<h.length;i++){ const g=getBPrediction(seed,{nbr:h[i-1].nbr,sum:h[i-1].sum,type:h[i-1].type}); hits.push(g.includes(h[i].type)?1:0); }
 const total=hits.length; if(!total) return {error:1};
 const overall=hits.reduce((a,b)=>a+b,0)/total;
 const r30=hits.slice(-30); const rr=r30.reduce((a,b)=>a+b,0)/r30.length;
 const blocks=[]; for(let i=0;i<=total-10;i+=10){const b=hits.slice(i,i+10); blocks.push(b.reduce((a,c)=>a+c,0)/b.length);}
 const mean=blocks.reduce((a,b)=>a+b,0)/blocks.length;
 const variance=blocks.reduce((a,b)=>a+(b-mean)**2,0)/blocks.length;
 const stability=Math.max(0,Math.min(1,1-Math.sqrt(variance)));
 let c=0,m=0; hits.forEach(x=>{ if(!x){c++;m=Math.max(m,c)}else c=0; });
 const lossPen=Math.max(0,1-m/total);
 const score=overall*0.4+rr*0.3+stability*0.2+lossPen*0.1;
 return {overall, recentRate:rr, stability, score, hits};
}
function selectSeed(h){
 if(h.length<50) return {error:1};
 let bs=-1,bseed=null,bd=null;
 for(let s=1000;s<=50000;s+=10){ const d=seedBacktest(h,s); if(d.error) continue; if(d.score>bs){bs=d.score;bseed=s;bd=d;} }
 if(!bseed) return {error:1};
 const ss=Math.max(1000,bseed-9), es=Math.min(50000,bseed+9);
 for(let s=ss;s<=es;s++){ const d=seedBacktest(h,s); if(d.error) continue; if(d.score>bs){bs=d.score;bseed=s;bd=d;} }
 return {bestSeed:bseed, score:bs, detail:bd};
}
function predictB(h){
 const r=selectSeed(h); if(r.error) return {error:1};
 const g=getBPrediction(r.bestSeed,h[h.length-1]);
 let o=0,e=0; g.forEach(x=>x.endsWith("单")?o++:e++);
 const total=o+e; const pOdd=total?o/total:0.5;
 return {seed:r.bestSeed, pOdd, prediction:pOdd>=0.5?"单":"双", groups:g, detail:r.detail};
}
function comboScores(a,b){ const aBig=a.weightedProbability["大"]||0.5, aSmall=1-aBig; const bOdd=b.pOdd||0.5, bEven=1-bOdd; return {"大单":aBig*0.5+bOdd*0.5,"大双":aBig*0.5+bEven*0.5,"小单":aSmall*0.5+bOdd*0.5,"小双":aSmall*0.5+bEven*0.5}; }
function buildKill(a,b){ const sc=comboScores(a,b); const ranked=Object.entries(sc).sort((x,y)=>y[1]-x[1]); const killed=ranked[ranked.length-1][0]; return {killedGroup:killed, recommended:ranked.slice(0,-1).map(x=>x[0])}; }

// ============================================================
// 四、Toao 风格数据解析
// ============================================================
function parseAPI(raw){
  if(!raw || raw.message !== "success" || !Array.isArray(raw.data)) {
    throw new Error("接口格式异常");
  }
  var out = [];
  for(var i = 0; i < raw.data.length; i++) {
    var it = raw.data[i];
    var nbr = String(it.nbr).trim();
    if(!nbr) continue;
    var nums = it.number.split('+').map(Number);
    var sum = parseInt(it.num);
    if(isNaN(sum) || sum === 0) {
      sum = nums.reduce(function(a,b){ return a + b; }, 0);
    }
    if(sum === 0) continue;
    out.push({ nbr: nbr, number: it.number, num: sum, sum: sum, type: getType(sum) });
  }
  out.sort(function(a,b){ return parseInt(a.nbr) - parseInt(b.nbr); });
  return out.slice(-80);
}

// ============================================================
// 五、统计 + UI
// ============================================================
var historyData = [];
var session = { aCorrect:0, aWrong:0, bCorrect:0, bWrong:0, fCorrect:0, fWrong:0, records:[] };

function saveSession(){ try{ localStorage.setItem("pc28_fix", JSON.stringify(session)); }catch(e){} }
function loadSession(){ try{ var raw=localStorage.getItem("pc28_fix"); if(raw){ var s=JSON.parse(raw); Object.assign(session,s); } }catch(e){} }
loadSession();

function resetStats(){
  session.aCorrect=0; session.aWrong=0;
  session.bCorrect=0; session.bWrong=0;
  session.fCorrect=0; session.fWrong=0;
  saveSession(); updateUI(); logMsg("统计已清零");
}

function verifyOne(){
  if(!historyData.length) return false;
  var map = {}; historyData.forEach(function(h){ map[parseInt(h.nbr)] = h; });
  var idx = -1;
  for(var i=0; i<session.records.length; i++) {
    if(session.records[i].status === "待验证" && map[session.records[i].target]) {
      idx = i; break;
    }
  }
  if(idx === -1) return false;
  var rec = session.records[idx];
  var act = map[rec.target];
  if(rec.predA){ if(act.type[0] === rec.predA) session.aCorrect++; else session.aWrong++; }
  if(rec.predB){ if(act.type[1] === rec.predB) session.bCorrect++; else session.bWrong++; }
  if(rec.killed){ if(act.type !== rec.killed) session.fCorrect++; else session.fWrong++; }
  rec.status = "已验证";
  saveSession();
  return true;
}

function updateUI(){
  if(!historyData.length) return;
  var latest = historyData[historyData.length-1];
  var target = String(parseInt(latest.nbr) + 1);
  document.getElementById("target").textContent = target;
  document.getElementById("prev").textContent = latest.nbr + " " + latest.number + "=" + latest.sum + " (" + latest.type + ")";

  var resA = predictA(historyData);
  document.getElementById("model-a").textContent = resA.prediction;

  var resB = { pOdd:0.5, prediction:"--" };
  if(historyData.length >= 50) {
    try{ resB = predictB(historyData); document.getElementById("model-b").textContent = resB.prediction; } catch(e){}
  } else {
    document.getElementById("model-b").textContent = "数据不足";
  }

  if(resA.prediction && resB.prediction !== "--") {
    var kill = buildKill(resA, resB);
    document.getElementById("kill-group").textContent = "杀" + kill.killedGroup;
    document.getElementById("buy-groups").textContent = kill.recommended.join(" ");
    var found = false;
    for(var i=0; i<session.records.length; i++) {
      if(session.records[i].target === parseInt(target)) { found = true; break; }
    }
    if(!found) {
      session.records.push({ target: parseInt(target), predA: resA.prediction, predB: resB.prediction, killed: kill.killedGroup, status: "待验证" });
    }
  }

  function pct(c,w){ return (c+w)>0 ? ((c/(c+w))*100).toFixed(1)+"%" : "0%"; }
  document.getElementById("stat-a").textContent = session.aCorrect + "/" + session.aWrong;
  document.getElementById("stat-a-rate").textContent = pct(session.aCorrect, session.aWrong);
  document.getElementById("stat-b").textContent = session.bCorrect + "/" + session.bWrong;
  document.getElementById("stat-b-rate").textContent = pct(session.bCorrect, session.bWrong);
  document.getElementById("stat-final").textContent = session.fCorrect + "/" + session.fWrong;
  document.getElementById("stat-final-rate").textContent = pct(session.fCorrect, session.fWrong);

  var tb = document.getElementById("history-body");
  tb.innerHTML = "";
  var slice = historyData.slice(-30).reverse();
  for(var i=0; i<slice.length; i++) {
    var h = slice[i];
    var cls = "tag-" + (h.type === "大单" ? "big-odd" : h.type === "大双" ? "big-even" : h.type === "小单" ? "small-odd" : "small-even");
    var rec = null;
    for(var j=0; j<session.records.length; j++) {
      if(session.records[j].target === parseInt(h.nbr)) { rec = session.records[j]; break; }
    }
    var pred = "--", res = '<span class="pending">-</span>';
    if(rec) {
      if(rec.killed) pred = "杀" + rec.killed;
      if(rec.status === "已验证") {
        res = h.type !== rec.killed ? '<span class="hit">✓</span>' : '<span class="miss">✗</span>';
      }
    }
    var tr = document.createElement("tr");
    tr.innerHTML = "<td>" + h.nbr + "</td><td>" + h.number + "</td><td><span class=\"tag " + cls + "\">" + h.type + "</span></td><td><span class=\"tag tag-kill\">" + pred + "</span></td><td>" + res + "</td>";
    tb.appendChild(tr);
  }
}

function logMsg(m){
  var l = document.getElementById("log");
  var p = document.createElement("p");
  p.textContent = "[" + new Date().toLocaleTimeString() + "] " + m;
  l.appendChild(p);
  l.scrollTop = l.scrollHeight;
}

// ============================================================
// 六、Toao 风格 fetchData
// ============================================================
function fetchData() {
  fetchWithTimeout(API_URL, 10000)
    .then(function(res) { return res.json(); })
    .then(function(json) {
      if(json.message === "success" && json.data && json.data.length > 0) {
        var parsed = parseAPI(json);
        if(parsed.length > 0) {
          historyData = parsed;
          logMsg("✅ 实拉 " + historyData.length + " 期，最新期 " + historyData[historyData.length-1].nbr);
          while(verifyOne()) {}
          updateUI();
        } else {
          logMsg("⚠️ 解析后无数据");
        }
      } else {
        logMsg("⚠️ API返回异常");
      }
    })
    .catch(function(e) {
      logMsg("❌ 请求失败：" + e.message);
    });
}

document.getElementById("btn-reset").addEventListener("click", resetStats);

logMsg("🚀 启动 (修复版)");
fetchData();
setInterval(fetchData, CHECK_INTERVAL);
</script>
</body>
</html>
